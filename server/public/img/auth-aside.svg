<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-label="A lagoon at dusk with a bridge, a low city skyline and a glowing network of connected points in the sky above">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060e20"/>
      <stop offset="0.3" stop-color="#0c1d3e"/>
      <stop offset="0.52" stop-color="#173a63"/>
      <stop offset="0.68" stop-color="#43618a"/>
      <stop offset="0.8" stop-color="#a9734a"/>
      <stop offset="0.9" stop-color="#070f1f"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2748"/>
      <stop offset="0.35" stop-color="#08152b"/>
      <stop offset="1" stop-color="#040a15"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a3" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#f2a464" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a464" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cde6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cde6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- The copy sits over the left of the scene, so that corner is held back
         slightly: the skyline is still there, just never busy enough to fight it. -->
    <radialGradient id="copyScrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#050c1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#050c1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050c1a" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#050c1a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#050c1a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1400" fill="url(#sky)"/>

  <g fill="#dce9ff">
    <circle cx="96" cy="120" r="1.6" opacity="0.5"/>
    <circle cx="212" cy="64" r="1.2" opacity="0.38"/>
    <circle cx="330" cy="150" r="1.8" opacity="0.45"/>
    <circle cx="452" cy="88" r="1.1" opacity="0.4"/>
    <circle cx="561" cy="176" r="1.5" opacity="0.3"/>
    <circle cx="688" cy="112" r="1.3" opacity="0.45"/>
    <circle cx="806" cy="196" r="1.7" opacity="0.35"/>
    <circle cx="150" cy="248" r="1.2" opacity="0.28"/>
    <circle cx="742" cy="286" r="1.2" opacity="0.26"/>
    <circle cx="404" cy="232" r="1.4" opacity="0.24"/>
    <circle cx="58" cy="330" r="1.4" opacity="0.22"/>
  </g>

  <!-- The mind at work: a constellation of connected points in the sky. -->
  <g stroke="#8fc2ff" stroke-width="1.4" opacity="0.42" fill="none">
    <path d="M180 300 L318 388 L262 496 L120 448 Z"/>
    <path d="M318 388 L470 330 L556 452 L430 540 L262 496"/>
    <path d="M470 330 L626 268 L712 392 L556 452"/>
    <path d="M626 268 L800 320 L742 470 L712 392"/>
    <path d="M742 470 L640 566 L470 610 L430 540"/>
    <path d="M180 300 L120 448 L246 588 L430 540"/>
    <path d="M120 448 L74 566 L246 588"/>
    <path d="M430 540 L556 452 L640 566 L520 660 L300 664"/>
    <path d="M640 566 L742 470 L818 566 L700 660 L520 660"/>
    <path d="M470 330 L520 214 L626 268"/>
  </g>
  <g fill="#cfe6ff">
    <circle cx="180" cy="300" r="4"/>
    <circle cx="318" cy="388" r="5.4"/>
    <circle cx="262" cy="496" r="3.6"/>
    <circle cx="120" cy="448" r="3.2"/>
    <circle cx="470" cy="330" r="6"/>
    <circle cx="556" cy="452" r="3.8"/>
    <circle cx="430" cy="540" r="5.4"/>
    <circle cx="626" cy="268" r="5"/>
    <circle cx="712" cy="392" r="4.2"/>
    <circle cx="800" cy="320" r="3"/>
    <circle cx="742" cy="470" r="3.6"/>
    <circle cx="640" cy="566" r="4.4"/>
    <circle cx="470" cy="610" r="4"/>
    <circle cx="246" cy="588" r="3.2"/>
    <circle cx="74" cy="566" r="2.6"/>
    <circle cx="300" cy="664" r="3.2"/>
    <circle cx="520" cy="660" r="3.6"/>
    <circle cx="700" cy="660" r="2.8"/>
    <circle cx="818" cy="566" r="2.8"/>
    <circle cx="520" cy="214" r="3"/>
  </g>
  <g fill="url(#nodeGlow)">
    <circle cx="470" cy="330" r="44"/>
    <circle cx="430" cy="540" r="36"/>
    <circle cx="318" cy="388" r="30"/>
    <circle cx="626" cy="268" r="28"/>
    <circle cx="640" cy="566" r="26"/>
  </g>
  <g fill="#f2c48d">
    <circle cx="470" cy="330" r="2.8"/>
    <circle cx="430" cy="540" r="2.4"/>
    <circle cx="626" cy="268" r="2.2"/>
    <circle cx="640" cy="566" r="2.2"/>
  </g>

  <!-- The sun low over the lagoon, kept to the right of the words. -->
  <circle cx="702" cy="742" r="230" fill="url(#sunGlow)"/>
  <circle cx="702" cy="742" r="58" fill="#ffd79f" opacity="0.92"/>

  <ellipse cx="250" cy="800" rx="440" ry="300" fill="url(#copyScrim)"/>

  <!-- A far skyline, hazed by distance so the near city reads in front of it. -->
  <g fill="#1b3159" opacity="0.6">
    <rect x="0" y="880" width="64" height="60"/>
    <rect x="74" y="906" width="48" height="34"/>
    <rect x="336" y="884" width="52" height="56"/>
    <rect x="396" y="858" width="40" height="82"/>
    <rect x="446" y="898" width="58" height="42"/>
    <rect x="512" y="872" width="36" height="68"/>
    <rect x="656" y="890" width="54" height="50"/>
    <rect x="718" y="856" width="44" height="84"/>
    <rect x="774" y="894" width="56" height="46"/>
    <rect x="842" y="872" width="58" height="68"/>
  </g>

  <!-- The city itself, cut against the last of the light. Roofs are stepped and
       a few carry masts and water tanks, so the skyline reads as a place. -->
  <g fill="#050d1e">
    <rect x="0" y="924" width="88" height="36"/>
    <rect x="16" y="910" width="30" height="16"/>
    <rect x="96" y="944" width="66" height="16"/>
    <rect x="170" y="902" width="52" height="58"/>
    <rect x="182" y="890" width="26" height="14"/>
    <rect x="230" y="952" width="96" height="8"/>
    <rect x="340" y="930" width="54" height="30"/>
    <rect x="402" y="884" width="70" height="76"/>
    <rect x="418" y="862" width="38" height="24"/>
    <rect x="430" y="838" width="4" height="26"/>
    <rect x="480" y="912" width="64" height="48"/>
    <rect x="536" y="846" width="26" height="114"/>
    <rect x="528" y="826" width="42" height="22"/>
    <rect x="570" y="928" width="58" height="32"/>
    <rect x="636" y="896" width="46" height="64"/>
    <rect x="646" y="880" width="26" height="18"/>
    <rect x="688" y="944" width="86" height="16"/>
    <rect x="782" y="888" width="50" height="72"/>
    <rect x="796" y="872" width="22" height="18"/>
    <rect x="838" y="930" width="62" height="30"/>
  </g>
  <!-- Masts and tanks, the small furniture of a real roofline. -->
  <g stroke="#050d1e" stroke-width="2.4" fill="none">
    <path d="M204 890 L204 866 M188 866 L220 866"/>
    <path d="M360 930 L360 918 M348 918 L372 918"/>
    <path d="M806 872 L806 850 M792 850 L820 850"/>
    <path d="M118 944 L118 932"/>
  </g>
  <!-- Lit windows: sparse, because a dense grid would read as a pattern. -->
  <g fill="#ffcf92" opacity="0.85">
    <rect x="182" y="914" width="5" height="7"/>
    <rect x="196" y="914" width="5" height="7"/>
    <rect x="182" y="932" width="5" height="7"/>
    <rect x="412" y="900" width="6" height="8"/>
    <rect x="428" y="900" width="6" height="8"/>
    <rect x="428" y="920" width="6" height="8"/>
    <rect x="444" y="900" width="6" height="8"/>
    <rect x="412" y="940" width="6" height="8"/>
    <rect x="490" y="924" width="6" height="8"/>
    <rect x="508" y="924" width="6" height="8"/>
    <rect x="540" y="862" width="5" height="7"/>
    <rect x="540" y="880" width="5" height="7"/>
    <rect x="540" y="898" width="5" height="7"/>
    <rect x="552" y="880" width="5" height="7"/>
    <rect x="650" y="910" width="6" height="8"/>
    <rect x="666" y="910" width="6" height="8"/>
    <rect x="650" y="932" width="6" height="8"/>
    <rect x="792" y="906" width="6" height="8"/>
    <rect x="808" y="906" width="6" height="8"/>
    <rect x="792" y="932" width="6" height="8"/>
    <rect x="856" y="940" width="6" height="8"/>
    <rect x="108" y="948" width="5" height="6"/>
    <rect x="584" y="938" width="5" height="6"/>
  </g>

  <!-- The lagoon takes the sky's last light. -->
  <rect x="0" y="960" width="900" height="440" fill="url(#water)"/>

  <!-- Third Mainland Bridge, standing in the water in front of the city, with its
       deck low enough that the cables never tangle with the rooftops. -->
  <g fill="#03070f">
    <rect x="0" y="1054" width="900" height="12"/>
    <rect x="238" y="968" width="11" height="86"/>
    <rect x="560" y="952" width="11" height="102"/>
    <rect x="852" y="972" width="11" height="82"/>
  </g>
  <g stroke="#0a1526" stroke-width="2" fill="none">
    <path d="M243 972 L158 1054 M243 972 L330 1054 M243 972 L220 1054 M243 972 L268 1054"/>
    <path d="M565 956 L470 1054 M565 956 L662 1054 M565 956 L538 1054 M565 956 L594 1054"/>
    <path d="M857 976 L790 1054 M857 976 L900 1054 M857 976 L840 1054"/>
  </g>
  <g fill="#ffcf92" opacity="0.85">
    <circle cx="243" cy="970" r="2.6"/>
    <circle cx="565" cy="954" r="2.6"/>
    <circle cx="857" cy="974" r="2.6"/>
  </g>
  <!-- Deck traffic: two small lights each way. -->
  <g fill="#fff4de" opacity="0.75">
    <rect x="120" y="1058" width="10" height="2.4" rx="1.2"/>
    <rect x="392" y="1058" width="10" height="2.4" rx="1.2"/>
    <rect x="700" y="1058" width="10" height="2.4" rx="1.2"/>
  </g>
  <g fill="#ff9a7a" opacity="0.7">
    <rect x="258" y="1060" width="9" height="2.2" rx="1.1"/>
    <rect x="596" y="1060" width="9" height="2.2" rx="1.1"/>
    <rect x="812" y="1060" width="9" height="2.2" rx="1.1"/>
  </g>

  <!-- Reflections: the sun's column, the city's smears and the bridge's shadow. -->
  <g fill="#f0b477">
    <rect x="672" y="1076" width="62" height="4" rx="2" opacity="0.5"/>
    <rect x="656" y="1096" width="94" height="4" rx="2" opacity="0.4"/>
    <rect x="686" y="1118" width="52" height="3.5" rx="1.75" opacity="0.3"/>
    <rect x="640" y="1146" width="124" height="3.5" rx="1.75" opacity="0.22"/>
    <rect x="700" y="1180" width="42" height="3" rx="1.5" opacity="0.16"/>
    <rect x="606" y="1220" width="140" height="3" rx="1.5" opacity="0.1"/>
  </g>
  <g fill="#8fc2ff" opacity="0.2">
    <rect x="130" y="1084" width="70" height="3" rx="1.5"/>
    <rect x="250" y="1112" width="44" height="3" rx="1.5"/>
    <rect x="430" y="1092" width="58" height="3" rx="1.5"/>
    <rect x="780" y="1108" width="62" height="3" rx="1.5"/>
    <rect x="96" y="1152" width="112" height="3" rx="1.5"/>
    <rect x="336" y="1194" width="92" height="3" rx="1.5"/>
    <rect x="560" y="1236" width="104" height="3" rx="1.5"/>
    <rect x="188" y="1272" width="132" height="3" rx="1.5"/>
  </g>

  <!-- A canoe crossing, with one lamp: the lagoon is worked, not just looked at. -->
  <g fill="#040a16">
    <path d="M120 1130 q26 14 52 0 q-26 8 -52 0 Z"/>
  </g>
  <circle cx="146" cy="1122" r="3" fill="#ffcf92" opacity="0.8"/>

  <!-- An ankara-inspired border at the foot: geometry, not a pattern photo. Tall
       panels show it; short ones crop it away without losing anything. -->
  <g stroke="#e0a86a" stroke-width="2.6" fill="none" opacity="0.55">
    <path d="M0 1330 L45 1300 L90 1330 L135 1300 L180 1330 L225 1300 L270 1330 L315 1300 L360 1330 L405 1300 L450 1330 L495 1300 L540 1330 L585 1300 L630 1330 L675 1300 L720 1330 L765 1300 L810 1330 L855 1300 L900 1330"/>
  </g>
  <g fill="none" stroke="#e0a86a" stroke-width="1.8" opacity="0.4">
    <circle cx="90" cy="1364" r="11"/>
    <circle cx="270" cy="1364" r="11"/>
    <circle cx="450" cy="1364" r="11"/>
    <circle cx="630" cy="1364" r="11"/>
    <circle cx="810" cy="1364" r="11"/>
  </g>
  <g fill="#7fb4ff" opacity="0.35">
    <rect x="152" y="1358" width="11" height="11" transform="rotate(45 158 1364)"/>
    <rect x="332" y="1358" width="11" height="11" transform="rotate(45 338 1364)"/>
    <rect x="512" y="1358" width="11" height="11" transform="rotate(45 518 1364)"/>
    <rect x="692" y="1358" width="11" height="11" transform="rotate(45 698 1364)"/>
    <rect x="872" y="1358" width="11" height="11" transform="rotate(45 878 1364)"/>
  </g>

  <!-- One even veil, so the copy stays readable over every part of the scene. -->
  <rect width="900" height="1400" fill="url(#veil)"/>
</svg>
