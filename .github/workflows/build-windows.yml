## Builds and publishes the Windows installer.
##
## The public release repository is separate from this source repository. Add a
## RELEASES_TOKEN secret with write access to King-odysseus/zuri-releases before
## running this workflow. Without it, the installer remains a workflow artifact.
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run react:build
      - name: Build the Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: zuri-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish to the public releases repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Host 'RELEASES_TOKEN is not set, so the exe stays in the workflow artifact.'
            exit 0
          }
          npm run release:publish
