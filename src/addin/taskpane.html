<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="zuri-token" content="__ZURI_TOKEN__" />
    <title>Zuri</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.officeapps.live.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>Zuri</h1>
      <p class="hint">Select some text, or leave nothing selected to use the whole document.</p>

      <label for="prompt">What should Zuri do?</label>
      <textarea id="prompt" rows="4" placeholder="Rewrite this more formally"></textarea>

      <div class="row">
        <button id="ask" type="button">Ask Zuri</button>
        <span id="status" role="status"></span>
      </div>

      <label for="answer">Zuri's answer</label>
      <textarea id="answer" rows="9" placeholder="The answer appears here. You can edit it before using it."></textarea>

      <div class="row">
        <button id="replace" type="button" class="secondary" disabled>Replace selection</button>
        <button id="insert" type="button" class="secondary" disabled>Insert below</button>
      </div>
    </main>
    <script src="taskpane.js"></script>
  </body>
</html>
