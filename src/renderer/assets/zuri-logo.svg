<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zuri">
  <!--
    Zuri's logo: one accent tile carrying the brand mark.

    The bubble is drawn in white and its two eyes are holes punched through it by
    fill-rule, so the tile shows through them. That is the same construction the
    sidebar brand mark uses at 32 px (components.css .sidebar-brand-mark, whose
    radius/brand is 10 at that size and therefore 20 on this 64 px tile), so the
    window icon, the tab icon and the mark inside the app are one shape.

    This file is the single source for both the app icon and the page favicon: the
    PNG that the Electron window points at is rasterised from it by
    scripts/make-icon.js, so the two cannot drift apart.
  -->
  <rect width="64" height="64" rx="20" fill="#006fee" />
  <g transform="translate(14 14) scale(1.5)">
    <path
      fill="#ffffff"
      fill-rule="evenodd"
      d="M10.2 0H13.8C18.9 0 24 3.9 24 8.6V12.4C24 16.3 22 20.2 20.05 20.2V24L13.8 21.4H9.2C4.6 21.4 0 17.25 0 13.1V8.4C0 4.2 5.1 0 10.2 0ZM5.8 8.3A1.86 1.86 0 0 1 9.5 8.3V13.8A1.86 1.86 0 0 1 5.8 13.8ZM14.3 8.3A1.86 1.86 0 0 1 18.1 8.3V13.8A1.86 1.86 0 0 1 14.3 13.8Z"
    />
  </g>
</svg>
